    <script>
        // The grid is plain markup, so the photos show with or without this script.
        // Everything below is the enlarged view layered on top of it.
        (function () {
            const grid = document.getElementById('gallery-grid');
            if (!grid) return;

            grid.querySelectorAll('img').forEach(img => {
                const markBroken = () => img.closest('.gallery-item').dataset.state = 'error';
                if (img.complete && img.naturalWidth === 0) markBroken();
                img.addEventListener('error', markBroken);
            });

            grid.addEventListener('click', event => {
                // Let the browser handle open-in-new-tab and non-primary clicks.
                if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
                const item = event.target.closest('.gallery-item');
                if (!item || item.dataset.state === 'error') return;
                event.preventDefault();
                openFullscreen(item);
            });

            function openFullscreen(item) {
                const thumbnail = item.querySelector('img');

                const overlay = document.createElement('div');
                overlay.className = 'gallery-fullscreen';
                overlay.setAttribute('role', 'dialog');
                overlay.setAttribute('aria-modal', 'true');
                overlay.setAttribute('aria-label', thumbnail.alt || 'Imagen ampliada');

                const full = document.createElement('img');
                full.src = item.getAttribute('href');
                full.alt = thumbnail.alt;

                const close = document.createElement('button');
                close.type = 'button';
                close.className = 'gallery-close';
                close.textContent = 'X';
                close.setAttribute('aria-label', 'Cerrar imagen');

                overlay.append(full, close);
                document.body.appendChild(overlay);

                const background = [...document.body.children].filter(el => el !== overlay);
                const previousInert = background.map(el => el.inert);
                background.forEach(el => el.inert = true);
                document.documentElement.style.overflow = 'hidden';

                const dismiss = () => {
                    overlay.remove();
                    background.forEach((el, i) => el.inert = previousInert[i]);
                    document.documentElement.style.overflow = '';
                    item.focus();
                };

                overlay.addEventListener('click', dismiss);
                overlay.addEventListener('keydown', event => {
                    if (event.key === 'Escape') dismiss();
                    // The close button is the only focusable thing in here, so Tab stays on it.
                    if (event.key === 'Tab') { event.preventDefault(); close.focus(); }
                });
                close.focus();
            }
        })();
    </script>
